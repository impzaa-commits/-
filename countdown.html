<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>48H — Digital Countdown</title>
<style>
:root{color-scheme:dark;--fire:#ff5a18;--amber:#ffb13b}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,'Segoe UI',sans-serif;background:#080506;color:white}
body{display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% 75%,#5b1609 0%,#210a08 38%,#070406 78%)}
.stage{position:relative;isolation:isolate;width:min(1100px,94vw);min-height:490px;margin:24px;padding:58px 25px 45px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid #a33115;border-radius:26px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 3px,#ff5d0610 3px 4px),linear-gradient(140deg,#2d0a09e8,#090507e8 55%,#371009e8);box-shadow:0 0 28px #e83b173a,inset 0 0 75px #ff370b1a}
.stage:before{content:"";position:absolute;inset:-3px;z-index:-1;border-radius:inherit;background:conic-gradient(from var(--angle,0deg),#ff4e00,#250708 17%,#ffb72d 30%,#230607 49%,#ff3d00 68%,#150508 80%,#ff4e00);filter:blur(14px);opacity:.5;animation:spin 5s linear infinite}
@keyframes spin{to{--angle:360deg;transform:rotate(1deg)}}
.beams{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 20%,#ff6a0018 25%,transparent 29%,transparent 65%,#ff220016 72%,transparent 78%);background-size:220% 100%;animation:beam 4s linear infinite}
@keyframes beam{to{background-position:-220% 0}}
.rail{position:absolute;left:4%;right:4%;height:4px;overflow:hidden;background:#e74a1928;box-shadow:0 0 12px #ff3a1866}.rail.top{top:25px}.rail.bottom{bottom:25px}
.rail:after{content:"";position:absolute;width:26%;height:100%;background:linear-gradient(90deg,transparent,#ff5215,#ffd35d,#ff5215,transparent);box-shadow:0 0 20px #ff4a00;animation:run 2.3s linear infinite}
.rail.bottom:after{animation-direction:reverse;animation-duration:3.1s}
@keyframes run{from{left:-30%}to{left:105%}}
.tag{letter-spacing:.55em;color:#ffb86e;font-size:clamp(12px,1.8vw,18px);text-shadow:0 0 15px #fd6411;margin-bottom:26px;text-align:center}
.timer{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vw,16px);font-family:'Consolas','Courier New',monospace;font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(41px,10vw,126px);line-height:1;letter-spacing:-.055em;text-shadow:0 0 9px #ffb020,0 0 23px #ff5c09,0 0 65px #f32910;color:#ffb342;white-space:nowrap}
.digits{min-width:2ch;text-align:center}.colon{font-size:.72em;opacity:.92;animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{opacity:.3}}
.labels{display:flex;justify-content:space-around;width:min(720px,87%);margin-top:20px;color:#eb8251;font-size:clamp(11px,1.6vw,15px);letter-spacing:.24em;text-align:center}
.sub{font-size:clamp(12px,1.7vw,17px);margin-top:38px;color:#ffe0ad;letter-spacing:.2em;text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:25px}
button{cursor:pointer;color:#ffe4c2;background:#37130d;border:1px solid #f76a29;border-radius:10px;padding:12px 20px;font-weight:bold;letter-spacing:.07em;box-shadow:0 0 10px #ff450033}
button:hover{background:#69220e}button:focus-visible{outline:2px solid #ffd97a;outline-offset:3px}
.note{max-width:790px;text-align:center;color:#d18d68;font-size:12px;line-height:1.5;margin-top:18px}
@media(max-width:550px){.stage{min-height:380px;padding:55px 8px 35px;border-radius:18px}.tag{letter-spacing:.22em}.timer{gap:1px;font-size:clamp(37px,10.5vw,60px)}.labels{width:92%}.sub{letter-spacing:.08em;margin-top:26px}}
@media(prefers-reduced-motion:reduce){.beams,.rail:after,.colon,.stage:before{animation:none}}
</style></head>
<body>
<main class="stage" aria-label="ตัวนับถอยหลัง 48 ชั่วโมง">
<div class="beams"></div><div class="rail top"></div><div class="rail bottom"></div>
<div class="tag">48 HOURS COUNTDOWN</div>
<div class="timer" role="timer" aria-label="เวลาคงเหลือ"><span id="hours" class="digits">48</span><span class="colon">:</span><span id="minutes" class="digits">00</span><span class="colon">:</span><span id="seconds" class="digits">00</span></div>
<div class="labels"><span>HOURS</span><span>MINUTES</span><span>SECONDS</span></div>
<div class="sub" id="status">COUNTDOWN ACTIVATED</div>
<div class="controls"><button id="start">เริ่มนับ 48 ชั่วโมงใหม่</button><button id="pause">หยุดชั่วคราว</button><button id="reset">รีเซ็ตเป็น 48:00:00</button></div>
<div class="note">เวลาจะถูกจำไว้ในเบราว์เซอร์นี้ แม้ปิดหน้าเว็บแล้วเปิดใหม่ · ปุ่มเริ่มใหม่จะเริ่มนับทันที · การนับเริ่มโดยอัตโนมัติเมื่อเปิดครั้งแรก</div>
</main>
<script>
(()=>{'use strict';
const KEY='neon48-countdown-v1',DURATION=48*60*60*1000;
const $=id=>document.getElementById(id);let state;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||typeof state.endAt!=='number'||typeof state.remaining!=='number'||typeof state.running!=='boolean'){state={endAt:Date.now()+DURATION,remaining:DURATION,running:true};save()}
const pad=n=>String(n).padStart(2,'0');
function remaining(){return Math.max(0,state.running?state.endAt-Date.now():state.remaining)}
function render(){let ms=remaining();let seconds=Math.ceil(ms/1000);$('hours').textContent=pad(Math.floor(seconds/3600));$('minutes').textContent=pad(Math.floor(seconds%3600/60));$('seconds').textContent=pad(seconds%60);
if(ms===0){if(state.running){state={endAt:Date.now(),remaining:0,running:false};save()}$('status').textContent='TIME IS UP';}else{$('status').textContent=state.running?'COUNTDOWN ACTIVATED':'PAUSED'}
$('pause').textContent=state.running?'หยุดชั่วคราว':'นับต่อ';}
$('start').onclick=()=>{state={endAt:Date.now()+DURATION,remaining:DURATION,running:true};save();render()};
$('reset').onclick=()=>{state={endAt:0,remaining:DURATION,running:false};save();render()};
$('pause').onclick=()=>{if(state.running){state.remaining=remaining();state.running=false;state.endAt=0}else{state.endAt=Date.now()+state.remaining;state.running=true}save();render()};
window.addEventListener('storage',e=>{if(e.key===KEY){try{const next=JSON.parse(e.newValue);if(next)state=next}catch(err){}render()}});
render();setInterval(render,200);
})();
</script></body></html>
